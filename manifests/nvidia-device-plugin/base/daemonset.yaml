apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: nvidia-device-plugin
    app.kubernetes.io/component: device-plugin
    app.kubernetes.io/part-of: hybrid-inference
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-device-plugin
        app.kubernetes.io/component: device-plugin
    spec:
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      priorityClassName: "system-node-critical"
      containers:
      - name: nvidia-device-plugin
        image: nvcr.io/nvidia/k8s-device-plugin:v0.18.0
        imagePullPolicy: IfNotPresent
        args:
        - --config-file=/config/config.yaml
        - --container-driver-root=/
        - --nvidia-dev-root=/
        securityContext:
          privileged: true
        volumeMounts:
        - name: device-plugin
          mountPath: /var/lib/kubelet/device-plugins
        - name: cdi-specs-etc
          mountPath: /etc/cdi
        - name: cdi-specs-run
          mountPath: /var/run/cdi
        - name: driver-root
          mountPath: /driver-root
          readOnly: true
        - name: config
          mountPath: /config
          readOnly: true
      volumes:
      - name: device-plugin
        hostPath:
          path: /var/lib/kubelet/device-plugins
      - name: cdi-specs-etc
        hostPath:
          path: /etc/cdi
      - name: cdi-specs-run
        hostPath:
          path: /var/run/cdi
      - name: driver-root
        hostPath:
          path: /
      - name: config
        configMap:
          name: nvidia-device-plugin

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-slm
  namespace: vllm-slm
  labels:
    app.kubernetes.io/name: vllm-slm
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: hybrid-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-slm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-slm
        app.kubernetes.io/component: inference
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        imagePullPolicy: IfNotPresent
        args:
        - "--model"
        - "Qwen/Qwen2.5-1.5B-Instruct"
        - "--max-model-len"
        - "32768"
        - "--gpu-memory-utilization"
        - "0.5"
        - "--enforce-eager"
        ports:
        - name: api
          containerPort: 8000
          protocol: TCP
        env:
        - name: HOME
          value: "/tmp"
        - name: HF_HOME
          value: "/tmp/hf-cache"
        - name: HUGGINGFACE_HUB_CACHE
          value: "/tmp/hf-cache"
        volumeMounts:
        - name: hf-cache
          mountPath: /tmp/hf-cache
        resources:
          limits:
            nvidia.com/gpu: 1
        startupProbe:
          httpGet:
            path: /health
            port: api
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 360
        livenessProbe:
          httpGet:
            path: /health
            port: api
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: api
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: hf-cache
        emptyDir:
          sizeLimit: 4Gi
